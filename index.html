function draw(){s.hp=clamp(s.hp);s.stamina=clamp(s.stamina);s.morale=clamp(s.morale);s.infection=clamp(s.infection);document.getElementById('heroName').textContent=s.name;document.getElementById('originText').textContent=s.origin+' · '+s.diff+'难度';document.getElementById('date').textContent='第'+day()+'天 · '+halfLabel();document.getElementById('rescue').textContent=Math.max(0,60-day())+' 天';document.getElementById('weather').textContent=s.weather||'阴';document.getElementById('meters').innerHTML=[['健康',s.hp,'rust'],['体力',s.stamina,'blue'],['士气',s.morale,''],['感染风险',s.infection,'rust']].map(([n,v,t])=>`<div class="meter" data-tone="${t}"><div class="meterhead"><span>${n}</span><b>${v}/100</b></div><div class="track"><i style="width:${v}%"></i></div></div>`).join('');document.getElementById('resources').innerHTML=[['口粮',s.food,'份'],['饮水',s.water,'份'],['药品',s.med,'份'],['木料',s.wood,'份'],['燃料',s.fuel,'份'],['电池',s.battery,'节']].map(([n,v,u])=>`<div class="resource"><small>${n}</small><b>${v}</b> <small>${u}</small></div>`).join('');document.getElementById('mobileHud').innerHTML=`<span>♥ ${s.hp} 健康</span><span>⚡ ${s.stamina} 体力</span><span>🥫 ${s.food} 口粮</span><span>💧 ${s.water} 饮水</span><span>☼ ${s.morale} 士气</span>`;document.getElementById('story').textContent=s.endingText||`你在七号码头旧仓库醒来。短波里反复出现一个时间：第60天的救援信号窗口。外面雨势未停，先想办法守住今天。`;if(!apiBusy){const cfg=getNarrativeConfig();setNarrativeStatus(cfg.key?'DeepSeek 已连接 · 行动和事件将自动续写':'本地备用叙述 · 填入 DeepSeek API Key 后将自动由 AI 续写',cfg.key?'ready':'local')}document.getElementById('statusText').textContent=`避难所里有${s.people}名幸存者；入口防护等级 ${s.defense}。每过完整一天，每人消耗1份口粮和1份饮水。`;const goal=s.hp<42?["优先处理健康","健康已偏低。用药治疗或降低外出风险，避免一次失误结束本局。"]:s.water<6?["优先净水","储水不足以支撑下一轮消耗，先净水或寻找补给。"]:s.food<6?["优先找口粮","口粮储备偏低，尽快搜寻补给，避免饥饿持续损害健康与士气。"]:s.stamina<28?["先恢复体力","体力不足会限制远行，休整半日后再安排高风险行动。"]:s.defense<2?["加固避难所","入口防护较弱。手头木料足够时加固，降低据点长期风险。"]:["稳步求生","补充口粮与饮水，留意队伍状态，为第60天的信号窗口做准备。"];const chapterCount=Math.min(3,Array.isArray(s.chapters)?s.chapters.length:0),sagaLabel=s.flags&&s.flags.coastRoute?"海岸航道已确认":chapterCount===0?"等待短波线索":chapterCount===1?"收到白塔录音":chapterCount===2?"退潮路线已出现":"等待最后决定";document.getElementById('objective').innerHTML='<b style="color:var(--lime)">当前目标</b><p class="muted">'+goal[1]+'</p><div class="chapter-progress"><span>白塔求救线索</span><b>'+chapterCount+'/3</b> · '+sagaLabel+'</div>';document.getElementById('actions').innerHTML=ACTIONS.map(a=>{const weatherRisk=a[0]==='explore'&&['暴雨','浓雾','雾'].includes(s.weather),extra='当前'+s.weather+'：体力额外−8，搜寻收获减少';return `<button class="action" onclick="act('${a[0]}')"><strong>${a[1]}</strong><small>${a[2]}${weatherRisk?'<br><span style="color:var(--rust)">⚠ '+extra+'</span>':''}</small><span class="cost">${a[3]}${weatherRisk?' · 天气不佳':''}</span></button>`}).join('');document.getElementById('rooms').innerHTML=[['入口工事','防护等级 '+s.defense,'act(\'fortify\')','加固入口'],['雨水净化','净水燃料 '+s.fuel+'份','act(\'purify\')','处理雨水'],['简易药台','药品 '+s.med+'份 · 感染 '+s.infection,'act(\'treat\')','处理伤病']].map(a=>`<div class="room"><b>${a[0]}</b><p class="muted">${a[1]}</p><button class="btn" onclick="${a[2]}">${a[3]}</button></div>`).join('');document.getElementById('recent').innerHTML=s.log.slice(0,3).map(x=>`<div class="logitem">第${x.day}天 · ${x.text}</div>`).join('')||'<span class="muted">还没有新的记录。</span>';document.getElementById('history').innerHTML=s.log.map(x=>`<div class="logitem">第${x.day}天 · ${x.text}</div>`).join('')||'<span class="muted">生存记录将在这里留下。</span>';save(false)}
function advance(halfUnits){for(let n=0;n<halfUnits;n++){s.units++;if(s.units%2===0){const daily=Math.ceil(s.people*(s.diff==='严酷'?1.15:1));s.food=Math.max(0,s.food-daily);s.water=Math.max(0,s.water-daily);if(s.food===0){s.hp-=6;s.morale-=4}if(s.water===0){s.hp-=10;s.stamina-=5}if(day()%4===0){s.weather=s.diff==='严酷'?'暴雨':'浓雾';s.hp-=s.diff==='严酷'?2:0}else s.weather=['阴','阵雨','雾'][day()%3];if(day()%5===0&&s.food>0&&s.water>0)s.hp+=2}}s.hp=clamp(s.hp);s.stamina=clamp(s.stamina);s.morale=clamp(s.morale);draw();if(s.hp<=0){s.ending=true;s.endingText='火种熄灭。你的队伍将接过故事，记住你守住的每一天。';note('健康耗尽，生存旅程结束。');setTimeout(()=>endModal(),250)}else if(day()>=60&&!s.endingPrompted){s.endingPrompted=true;setTimeout(()=>rescueModal(),250)}}
function act(type){if(s.ending)return;let half=2;if(type==='rest'){s.stamina=clamp(s.stamina+30);s.morale=clamp(s.morale+3);half=1;note('休整半日，恢复体力。');s.endingText='你睡了半日。醒来时，有人替你留了一杯温水。'}else if(type==='scavenge'||type==='explore'){const weatherRisk=type==='explore'&&['暴雨','浓雾','雾'].includes(s.weather),cost=(type==='explore'?22:12)+(weatherRisk?8:0);if(s.stamina<cost)return toast('体力不足，先休整半日。');s.stamina-=cost;half=type==='explore'?4:2;const mult=s.origin==='货运司机'?1.25:1,bonus=s.diff==='严酷'?.85:1;const yieldFactor=type==='explore'&&weatherRisk?.75:1,food=Math.round((type==='explore'?10:6)*mult*bonus*yieldFactor),water=Math.round((type==='explore'?8:5)*bonus*yieldFactor);s.food+=food;s.water+=water;if(Math.random()<(type==='explore'?.5:.28)){note('外出搜寻带回口粮和饮水，途中遇到异常情况。');s.endingText=`你带回${food}份口粮、${water}份饮水。街巷尽头传来异样动静。`}else{note(`外出搜寻带回${food}份口粮与${water}份饮水。`);s.endingText=`你在附近找到${food}份口粮和${water}份饮水，赶在天色变暗前回到仓库。`}}else if(type==='fortify'){const cost=s.origin==='维修学徒'?1:2;if(s.wood<cost)return toast(`木料不足，需要${cost}份。`);s.wood-=cost;s.defense++;half=2;note('修补入口，防护等级提升。');s.endingText='你把变形的铁门重新固定，风雨暂时被挡在外面。'}else if(type==='purify'){if(s.fuel<1)return toast('燃料不足，无法净水。');s.fuel--;s.water+=s.diff==='严酷'?5:7;half=2;note('过滤雨水，储水增加。');s.endingText='过滤器重新响起来，干净的水一桶桶接满。'}else if(type==='radio'){if(s.battery<1)return toast('电池不足。');s.battery--;half=1;note('短波监听，尝试联络附近幸存者。');s.endingText='短波里传来断续呼叫。你辨认出旧体育馆方向的坐标。'}else if(type==='treat'){if(s.med<1)return toast('药品不足。');s.med--;s.infection=Math.max(0,s.infection-25);s.hp=clamp(s.hp+12);half=1;note('用药处理伤病，感染风险下降。');s.endingText='你清理伤口并用药处理。疼痛缓下来，呼吸也平稳了。'}advance(half);draw();if(!s.ending&&!s.endingPrompted&&!triggerChapter()&&((type==='scavenge'&&Math.random()<.28)||(type==='explore'&&Math.random()<.52)||(type==='radio'&&Math.random()<.7)||(type==='fortify'&&Math.random()<.18)))triggerEvent();save(false);if(!pendingEvent){const label=(ACTIONS.find(a=>a[0]===type)||[])[1]||type;generateAINarrative('action',{action:label,fallback:s.endingText})}}
function triggerChapter(){if(!Array.isArray(s.chapters))s.chapters=[];const c=CHAPTERS.find(x=>day()>=x.day&&!s.chapters.includes(x.id));if(!c)return false;s.chapters.push(c.id);note('关键篇章：'+c.title);eventModal(c);return true}
function triggerEvent(){const pool=EVENTS.filter(e=>!s.seen.slice(-3).includes(e.id));const e=pool[Math.floor(Math.random()*pool.length)]||EVENTS[Math.floor(Math.random()*EVENTS.length)];s.seen.push(e.id);s.seen=s.seen.slice(-10);note('突发事件：'+e.title);eventModal(e)}
function eventModal(e){pendingEvent=e;const m=document.getElementById('modal');m.innerHTML=`<div style="color:var(--rust);font-size:11px;letter-spacing:2px;margin-bottom:8px">突发事件 · 第${day()}天</div><h2>${e.title}</h2><p class="story" id="eventText">${e.text}</p><div class="choicegrid">${e.choices.map((c,i)=>`<button class="choice" onclick="resolveEvent(${i})"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('')}</div><div class="row"><button class="btn" onclick="rewriteEvent()">重新生成事件叙述</button></div>`;document.getElementById('modalWrap').classList.add('open');generateAINarrative('event',{event:e})}
function resolveEvent(index){if(!pendingEvent||s.ending)return;const e=pendingEvent,c=e.choices[index],id=c[2];const apply={aid:()=>{s.people++;s.food=Math.max(0,s.food-1);s.morale+=7;s.endingText='门开了。你把陌生人扶进仓库，也多了一份需要承担的口粮。'},verify:()=>{s.morale+=2;s.endingText='隔着门确认了伤者状况，决定天亮后再接应。'},deny:()=>{s.morale-=7;s.endingText='你没有开门。铁门守住了，仓库里却沉默了很久。'},rescue:()=>{s.people++;s.food=Math.max(0,s.food-2);s.stamina-=12;s.morale+=8;s.endingText='你们冒雨完成接应，多了一位伙伴，也多了一份责任。'},signal:()=>{s.morale+=3;s.battery=Math.max(0,s.battery-1);s.endingText='灯光在楼群间闪烁，远处很快亮起回应。'},wait:()=>{s.morale-=2;s.endingText='你决定等到天亮。屋顶的灯最终熄灭了。'},medicate:()=>{s.med=Math.max(0,s.med-1);s.infection-=18;s.morale+=3;s.endingText='小禾服药后沉沉睡去，大家轮流守在旁边。'},isolate:()=>{s.infection-=8;s.morale-=3;s.endingText='你腾出里间隔离观察，暂时保护了其他人。'},conserve:()=>{s.morale-=8;s.infection+=6;s.endingText='你留下药品，但拖延让病情变得更难判断。'},share:()=>{s.morale+=6;s.food=Math.max(0,s.food-1);s.endingText='每人分到一份，争吵慢慢平息。'},workers:()=>{s.morale-=2;s.stamina+=4;s.endingText='外出的人得到额外补给，明天仍有人愿意出门。'},control:()=>{s.morale-=8;s.defense+=1;s.endingText='你把仓库钥匙收好，大家暂时不再争论。'},supply:()=>{s.stamina-=12;s.food+=8;s.water+=6;s.med+=1;s.endingText='体育馆的物资点尚未被搬空，你们带着补给趁雨返回。'},listen:()=>{s.battery=Math.max(0,s.battery-1);s.morale+=2;s.endingText='多监听半日后，坐标和开放时间都确认了。'},record:()=>{s.morale+=1;s.endingText='你把坐标写在地图背面，决定先准备好再出发。'},salvage:()=>{s.stamina-=10;s.food+=2;s.water+=1;s.endingText='全员搬运抢回了一部分漂浮的物资。'},medicine:()=>{s.med+=1;s.food=Math.max(0,s.food-3);s.endingText='药箱被保住，但几箱口粮泡进了水里。'},barrier:()=>{s.wood=Math.max(0,s.wood-2);s.defense+=1;s.endingText='木板和沙袋挡住了门口的水。'},inspect:()=>{if(Math.random()<.5)s.med++;else s.wood++;s.stamina-=5;s.endingText='墙后找到一些有用的小物件，动静也引来了远处的注意。'},seal:()=>{s.wood=Math.max(0,s.wood-1);s.defense++;s.endingText='缝隙被钉死，仓库重新安静下来。'},move:()=>{s.morale-=1;s.endingText='你们搬到仓库里间，避开了那面墙。'},beacon_reply:()=>{s.battery=Math.max(0,s.battery-1);s.flags.coastRoute=true;s.morale+=4;s.endingText='白塔那边回了一声短促的“收到”。你们记下了退潮时刻。'},beacon_note:()=>{s.flags.beaconClue=true;s.endingText='你把频段和潮汐记在地图上，留待队伍准备充分时再判断。'},beacon_silence:()=>{s.morale-=3;s.endingText='短波安静下来，但那阵咳嗽声留在每个人心里。'},coast_go:()=>{s.battery=Math.max(0,s.battery-1);s.stamina-=10;s.flags.coastRoute=true;s.flags.rescuePlan='coast';s.endingText='你们沿旧堤抵达白塔，确认了救援船经过的航道。'},coast_supply:()=>{s.food=Math.max(0,s.food-2);s.flags.coastTrust=true;s.morale+=3;s.endingText='你把补给放在约好的石阶下，第二天收到了白塔的回信。'},coast_wait:()=>{s.morale-=1;s.endingText='退潮过去了。你们留在仓库，继续按原计划做准备。'},truth_open:()=>{s.morale+=8;s.flags.crewTrust=true;s.endingText='大家一起摊开地图，争论很久，最后有人主动提出负责照看伤员。'},truth_partial:()=>{s.morale+=2;s.flags.crewTrust=true;s.endingText='你只和几位核心伙伴商定路线，其他人暂时接受了安排。'},truth_hide:()=>{s.morale-=8;s.flags.crewTrust=false;s.endingText='你避开了谈话。仓库表面安静，伙伴们却察觉到你有所隐瞒。'}}[id];if(apply)apply();const delay={aid:2,verify:1,rescue:2,signal:1,medicate:1,isolate:2,share:1,supply:4,listen:1,salvage:2,inspect:1,move:1,coast_go:1,truth_open:1}[id]||0;if(delay)advance(delay);s.hp=clamp(s.hp);s.stamina=clamp(s.stamina);s.morale=clamp(s.morale);s.infection=clamp(s.infection);note('你选择：'+c[0]+'。');pendingEvent=null;closeM();draw();save(false);generateAINarrative('result',{event:e,choice:c[0],fallback:s.endingText})}
function rescueModal(){pendingEvent=null;const e={title:'第60天 · 信号窗口开启',text:'短波机里传来清晰的呼叫。救援船只会在日落前停靠一次。仓库里还有人不愿离开，也有人坚持马上上船。',choices:[['全队登船','放弃部分库存，优先带上所有幸存者。','ending_all'],['先派人确认','花半天探查岸边，再决定是否撤离。','ending_scout'],['留下守住仓库','不相信广播，继续留在熟悉的据点。','ending_stay']]};const m=document.getElementById('modal');m.innerHTML=`<div style="color:var(--gold);font-size:11px;letter-spacing:2px">最终抉择</div><h2>${e.title}</h2><p class="story">${e.text}</p><div class="choicegrid">${e.choices.map(c=>`<button class="choice" onclick="finishEnding('${c[2]}')"><b>${c[0]}</b><small>${c[1]}</small></button>`).join('')}</div>`;document.getElementById('modalWrap').classList.add('open')}
function finishEnding(id){s.ending=true;const result={ending_all:(s.flags.crewTrust!==false&&s.morale>=28)?'伙伴们跟上了你。救援船上的位置不宽裕，但最后没有人被留在码头。':'队伍在登船时发生迟疑。你带走了大多数人，仍有人选择留在熟悉的仓库。',ending_scout:(s.flags.coastRoute||s.hp>50)&&s.stamina>=16?'此前的白塔线索帮你们赶上了航道。你们确认信号可信，及时登船。':'探查耗尽了体力，救援船离开时你们仍在堤岸另一侧。',ending_stay:(s.defense>=3&&s.food+s.water>=12)?'加固的仓库和充足储备让留下成为一种选择。你们熄掉短波，开始修复这片街区。':'仓库撑过了风雨，却缺少继续生活的储备。你们决定在天亮后重新寻找出路。'};s.endingText=result[id];note('结局：'+s.endingText);document.getElementById('story').textContent=s.endingText;document.getElementById('modal').innerHTML=`<h2>这一段求生，暂告一段落</h2><p class="story">${s.endingText}</p><button class="btn primary" onclick="closeM()">回看记录</button><button class="btn" onclick="newGame()">再开一局</button>`;save(false);draw()}
function endModal(){document.getElementById('modal').innerHTML='<h2>火种熄灭</h2><p>健康耗尽，队伍未能撑到信号窗口。你可以回看记录，或重新开始。</p><button class="btn" onclick="closeM()">回看记录</button><button class="btn primary" onclick="newGame()">再开一局</button>';document.getElementById('modalWrap').classList.add('open');save(false)}
function startModal(){const m=document.getElementById('modal');m.innerHTML='<div style="color:var(--rust);letter-spacing:2px;font-size:11px">原创末日生存模拟</div><h2>写下你的求生起点</h2><p>灾后第三天，你在七号码头旧仓库醒来。救援信号窗口预计第60天开启；有限的物资、陌生的幸存者和需要守住的据点，都等你来安排。</p><label>幸存者姓名<input class="apiinput" id="startName" value="林舟" maxlength="12"></label><div class="muted">选择你的来历</div><div class="choicegrid">'+ORIGINS.map((o,i)=>`<button class="choice ${i===0?'selected':''}" onclick="pickOrigin(this,${i})"><b>${o.name}</b><small>${o.desc}</small></button>`).join('')+'</div><div class="muted">选择难度</div><div class="choicegrid"><button class="choice selected" data-diff="普通" onclick="pickDiff(this,this.dataset.diff)"><b>普通</b><small>每天按人数消耗补给</small></button><button class="choice" data-diff="严酷" onclick="pickDiff(this,this.dataset.diff)"><b>严酷</b><small>消耗更多，恶劣天气更伤身体</small></button></div><div class="row"><button class="btn primary" onclick="begin()">进入避难所</button></div>';document.getElementById('modalWrap').classList.add('open')}
function pickOrigin(b,i){b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedOrigin=i}function pickDiff(b,d){b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selectedDiff=d}
function begin(){s=fresh();s.name=document.getElementById('startName').value.trim()||'幸存者';s.origin=ORIGINS[selectedOrigin].name;s.diff=selectedDiff;const bonus=ORIGINS[selectedOrigin].bonus;s.med+=bonus.med||0;s.wood+=bonus.wood||0;s.stamina=clamp(s.stamina+(bonus.stamina||0));note('在七号码头旧仓库醒来，决定带领幸存者活下去。');s.endingText='你在七号码头旧仓库醒来，第一场雨还没有停。';closeM();draw();save(false);generateAINarrative('start',{action:'开始求生',fallback:s.endingText})}
function openApi(){let model=DEFAULT_MODEL;try{model=JSON.parse(localStorage.getItem(APIPREFS)||'{}').model||DEFAULT_MODEL}catch(e){}let key='';try{key=sessionStorage.getItem(APIKEY)||''}catch(e){}const m=document.getElementById('modal');m.innerHTML=`<h2>DeepSeek AI 设置</h2><p>接口固定为 DeepSeek 官方地址，填写你自己的 API Key。填好密钥后，开局、行动和事件后会自动生成故事并给出可选方案；只有你点选后才会执行，AI 不会替你安排行动；调用费用由 DeepSeek 按使用情况收取。密钥仅保存在当前浏览器会话中，请勿在公共设备填写。</p><label>API 接口（固定）<input class="apiinput" value="${DEEPSEEK_BASE}" readonly aria-readonly="true"></label><label>模型名称<select class="apiinput" id="apiModel"><option value="deepseek-v4-flash" ${model==='deepseek-v4-flash'?'selected':''}>deepseek-v4-flash（推荐）</option><option value="deepseek-v4-pro" ${model==='deepseek-v4-pro'?'selected':''}>deepseek-v4-pro</option></select></label><label>API Key<input class="apiinput" id="apiKey" type="password" value="${escAttr(key)}" autocomplete="off" placeholder="粘贴 DeepSeek API Key"></label><div class="row"><button class="btn primary" onclick="saveApi()">保存设置</button><button class="btn" onclick="closeM()">关闭</button></div><div id="apiStatus" class="muted"></div>`;document.getElementById('modalWrap').classList.add('open')}
function escAttr(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveApi(){const model=document.getElementById('apiModel').value,key=document.getElementById('apiKey').value.trim();if(!key)return toast('请粘贴 DeepSeek API Key。');if(!['deepseek-v4-flash','deepseek-v4-pro'].includes(model))return toast('请选择有效的 DeepSeek 模型。');localStorage.setItem(APIPREFS,JSON.stringify({model}));try{sessionStorage.setItem(APIKEY,key)}catch(e){return toast('浏览器无法临时保存密钥，请检查隐私设置。')}toast('DeepSeek 设置已保存；密钥仅在当前浏览器会话中有效');setNarrativeStatus('DeepSeek 已连接 · 行动和事件将自动续写','ready');closeM()}
function getNarrativeConfig(){let model=DEFAULT_MODEL,key='';try{model=JSON.parse(localStorage.getItem(APIPREFS)||'{}').model||DEFAULT_MODEL;key=sessionStorage.getItem(APIKEY)||''}catch(e){}return{model,key}}
function setNarrativeStatus(text,state=''){const el=document.getElementById('storyStatus');if(el){el.textContent=text;el.dataset.state=state}}
function getAvailableNarrativeActions(){return ACTIONS.filter(a=>{const id=a[0];if(id==='explore')return s.stamina>=(22+(['暴雨','浓雾','雾'].includes(s.weather)?8:0));if(id==='fortify')return s.wood>=(s.origin==='维修学徒'?1:2);if(id==='purify')return s.fuel>=1;if(id==='radio')return s.battery>=1;if(id==='treat')return s.med>=1;return true})}
function clearStoryChoices(){const box=document.getElementById('storyChoices'),head=document.getElementById('storyChoiceHeading');if(box)box.innerHTML='';if(head)head.hidden=true}
function renderStoryChoices(suggestions=[]){const box=document.getElementById('storyChoices'),head=document.getElementById('storyChoiceHeading');if(!box||!head)return;const available=getAvailableNarrativeActions(),seen=new Set();let picks=(Array.isArray(suggestions)?suggestions:[]).filter(x=>x&&available.some(a=>a[0]===x.action)&&!seen.has(x.action)&&seen.add(x.action)).slice(0,3).map(x=>({action:x.action,text:String(x.text||'').trim()}));for(const a of available){if(picks.length>=3)break;if(!seen.has(a[0])){seen.add(a[0]);picks.push({action:a[0],text:a[1]})}}box.replaceChildren();for(const x of picks){const a=available.find(y=>y[0]===x.action),button=document.createElement('button'),title=document.createElement('b'),meta=document.createElement('small');button.className='story-choice';button.type='button';button.onclick=()=>act(a[0]);title.textContent=x.text||a[1];meta.textContent=a[1]+' · '+a[3];button.append(title,meta);box.append(button)}head.hidden=picks.length===0}
function extractStreamingStory(raw){const marker=raw.indexOf('"story"');if(marker<0)return null;let i=raw.indexOf(':',marker)+1;while(/\s/.test(raw[i]||''))i++;if(raw[i]!=='"')return null;i++;const slash=String.fromCharCode(92);let out='',escaped=false;for(;i<raw.length;i++){const c=raw[i];if(escaped){if(c==='u'){if(i+4>=raw.length)return{text:out,complete:false};const hex=raw.slice(i+1,i+5);if(!/^[0-9a-f]{4}$/i.test(hex))return{text:out,complete:false};out+=String.fromCharCode(parseInt(hex,16));i+=4}else if(c==='n')out+=String.fromCharCode(10);else if(c==='r')out+=String.fromCharCode(13);else if(c==='t')out+=String.fromCharCode(9);else out+=c;escaped=false}else if(c===slash)escaped=true;else if(c==='"')return{text:out,complete:true};else out+=c}return{text:out,complete:false}}
async function generateAINarrative(kind,ctx={}){const cfg=getNarrativeConfig();if(kind!=='event')clearStoryChoices();if(!cfg.key){setNarrativeStatus('本地备用叙述 · 填入 DeepSeek API Key 后将自动由 AI 续写','local');if(kind!=='event'){s.storyChoices=getAvailableNarrativeActions().slice(0,3).map(a=>({action:a[0],text:a[1]}));renderStoryChoices(s.storyChoices);save(false)}return}if(aiNarrativeController)aiNarrativeController.abort();const controller=new AbortController(),seq=++aiNarrativeSeq;aiNarrativeController=controller;apiBusy=true;setNarrativeStatus('DeepSeek 正在续写，文字会边生成边显示…','busy');const event=ctx.event||null;const available=getAvailableNarrativeActions();const context={kind,day:day(),weather:s.weather,action:ctx.action||'',event:event?{title:event.title,text:event.text,choices:event.choices.map(c=>c[0])}:null,choice:ctx.choice||'',outcome:ctx.fallback||s.endingText,status:{health:s.hp,stamina:s.stamina,morale:s.morale,food:s.food,water:s.water,people:s.people,defense:s.defense},available_actions:available.map(a=>({id:a[0],name:a[1],cost:a[3]}))};const prompt='续写一段45至75字的原创中文末日故事，紧接当前剧情。然后给出恰好2个简短、具体、彼此不同的行动选择。action只能使用available_actions里的id。严格JSON，story必须放第一项：{"story":"故事","choices":[{"text":"选择","action":"scavenge"}]}。只返回JSON，不要Markdown。';let raw='',streamBuffer='';const target=kind==='event'?document.getElementById('eventText'):document.getElementById('story');const showPartial=()=>{const part=extractStreamingStory(raw);if(part&&target){target.textContent=part.text;if(part.text)setNarrativeStatus('DeepSeek 正在续写，文字会边生成边显示…','busy')}};try{const res=await fetch(DEEPSEEK_BASE+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},signal:controller.signal,body:JSON.stringify({model:cfg.model,temperature:.7,max_tokens:240,stream:true,messages:[{role:'system',content:'你是原创末日生存游戏的互动叙事作者。先写紧凑故事，再提供可执行的玩家选择。绝不替玩家选或执行行动；不改写规则数值；只返回指定JSON。'},{role:'user',content:JSON.stringify(context)+'\n'+prompt}]})});if(!res.ok)throw Error('HTTP '+res.status);if(!res.body||!res.body.getReader){const data=await res.json();raw=data.choices?.[0]?.message?.content?.trim()||''}else{const reader=res.body.getReader(),decoder=new TextDecoder();let ended=false;const consumeLine=line=>{if(!line.startsWith('data:'))return;const payload=line.slice(5).trim();if(!payload||payload==='[DONE]'){if(payload==='[DONE]')ended=true;return}try{const packet=JSON.parse(payload),delta=packet.choices?.[0]?.delta?.content||'';if(delta){raw+=delta;showPartial()}}catch(e){}};while(!ended){const {value,done}=await reader.read();if(done)break;streamBuffer+=decoder.decode(value,{stream:true});const lines=streamBuffer.split(/\r?\n/);streamBuffer=lines.pop()||'';for(const line of lines)consumeLine(line)}if(streamBuffer)consumeLine(streamBuffer);if(!raw)throw Error('空回复')}let output;try{output=JSON.parse(raw.replace(/^\u0060{3}(?:json)?\s*/i,'').replace(/\s*\u0060{3}$/,''))}catch(e){output={story:raw,choices:[]}}if(seq!==aiNarrativeSeq)return;const story=String(output.story||raw).trim();if(kind==='event'){const el=document.getElementById('eventText');if(el&&pendingEvent===event)el.textContent=story}else{s.endingText=story;s.storyChoices=Array.isArray(output.choices)?output.choices:[];draw();renderStoryChoices(s.storyChoices);save(false)}setNarrativeStatus('故事与行动选项由 DeepSeek AI 生成 · 等你选择','ready')}catch(e){if(e.name==='AbortError')return;if(seq===aiNarrativeSeq){setNarrativeStatus('AI 生成失败，显示本地备用内容 · 检查 API Key、余额或网络','error');if(kind!=='event')renderStoryChoices();toast('DeepSeek 没有返回故事选项；你仍可从场景下方选择行动。')}}finally{if(seq===aiNarrativeSeq){apiBusy=false;aiNarrativeController=null}}}
function rewriteEvent(){if(!pendingEvent)return;generateAINarrative('event',{event:pendingEvent})}
function save(show=true){try{localStorage.setItem(SAVE,JSON.stringify(s));if(show)toast('进度已保存在本机。')}catch(e){if(show)toast('本机存档失败，浏览器可能禁用了存储。')}}function saveGame(){save(true)}function newGame(){if(confirm('开始新一局会覆盖当前本机存档。继续吗？')){localStorage.removeItem(SAVE);selectedOrigin=0;selectedDiff='普通';s=fresh();startModal()}}
function closeM(){document.getElementById('modalWrap').classList.remove('open')}function openModal(){document.getElementById('modal').innerHTML='<h2>玩法说明</h2><p>目标：管理避难所与幸存者，维持食物、饮水和健康，撑到第60天信号窗口。每个行动推进半天或数天；口粮和饮水在完整的一天结束时按人数扣除。</p><p>搜寻可补充口粮饮水，远行收益高但耗体力；净水、治疗、休息、加固与无线电各有资源代价。事件选项会带来不同的时间、物资、士气或队伍变化。到第60天后选择结局。</p><button class="btn primary" onclick="closeM()">明白</button>';document.getElementById('modalWrap').classList.add('open')}
function toast(t){const b=document.createElement('div');b.textContent=t;b.style='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303a30;padding:10px 16px;border:1px solid #697959;border-radius:8px;z-index:50';document.body.appendChild(b);setTimeout(()=>b.remove(),2300)}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE));if(d&&Number.isFinite(d.units)){s={...fresh(),...d};draw();if(s.ending){document.getElementById('modal').innerHTML='<h2>这一段求生，暂告一段落</h2><p class="story">'+escAttr(s.endingText)+'</p><button class="btn primary" onclick="closeM()">回看记录</button>';document.getElementById('modalWrap').classList.add('open')}else if(day()>=60){s.endingPrompted=true;rescueModal()}else if(Array.isArray(s.storyChoices)&&s.storyChoices.length){renderStoryChoices(s.storyChoices)}else{generateAINarrative('action',{action:'根据当前局势继续',fallback:s.endingText})}return}}catch(e){}s=fresh();draw();startModal()}
document.querySelectorAll('.tabs button').forEach((b,i)=>b.setAttribute('onclick',`tab('${['now','act','base','log'][i]}',this)`));function tab(id,b){document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected','false'));b.setAttribute('aria-selected','true');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById('view-'+id).classList.add('active')}
load();
</script></body></html>
